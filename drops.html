<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="drops.css" />
    <title>Smokey Brand | Drops</title>
  </head>

  <body>
    <!-- HEADER -->

    <header>
      <div class="header-container">
        <div class="company-sec">
          <img src="Smokeylogo.jpg" alt="Smokey Brand Logo" class="logo" />
          <h1>Smokey</h1>
        </div>

        <nav>
          <ul>
            <li><a href="index.html#Home">Home</a></li>
            <li><a href="index.html#About">About Us</a></li>
            <li><a href="index.html#Designs">Design</a></li>
            <li><a href="drops.html">Drops</a></li>
            <li><a href="index.html#Contact">Contact Us</a></li>
            <li><a href="cart.html">Cart</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- DROPS -->

    <main>
      <section class="drops-page">
        <h2>Latest Drops</h2>

        <p>Explore the latest pieces from Smokey Brand.</p>

        <div class="design-grid">
          <div class="design-card">
            <img src="Smokey'stussy.jpg" alt="Smokey Tee" />
            <h3>Smokey Tee</h3>
            <p>$30</p>
            <button>Add to Cart</button>
          </div>

          <div class="design-card">
            <img src="Smokey'hoodie.jpg" alt="Smokey Hoodie" />
            <h3>Smokey Hoodie</h3>
            <p>$50</p>
            <button>Add to Cart</button>
          </div>

          <div class="design-card">
            <img src="grey'track.jpg" alt="Smokey Jacket" />
            <h3>Smokey Jacket</h3>
            <p>$70</p>
            <button>Add to Cart</button>
          </div>

          <div class="design-card">
            <img src="Smokey'streetwear.jpg" alt="Smokey Streetwear" />
            <h3>Smokey Streetwear</h3>
            <p>$60</p>
            <button>Add to Cart</button>
          </div>

          <div class="design-card">
            <img src="Smokey'polo.jpg" alt="Smokey Polo" />
            <h3>Smokey Polo</h3>
            <p>$45</p>
            <button>Add to Cart</button>
          </div>
        </div>
      </section>
    </main>
